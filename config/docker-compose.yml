services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fireflies_db
      POSTGRES_USER: fireflies_user
      POSTGRES_PASSWORD: fireflies2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireflies_user -d fireflies_db"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: config/app.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app
    depends_on:
      db:
        condition: service_healthy # Espera a que la BD esté 100% lista
    env_file:
      - ../app/.env
    environment:
      DB_HOST: db
    # Aplica migraciones automáticamente antes de levantar el servidor
    command: >
      sh -c "python manage.py migrate && 
             python manage.py runserver 0.0.0.0:8000"

  gui:
    build:
      context: ..
      dockerfile: config/gui.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../gui:/app
      - /app/node_modules # Aísla los módulos para que no se borren
    depends_on:
      - app
    # Instala dependencias nuevas automáticamente antes de iniciar Vue
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data: